[platformio]
default_envs = release

[env]
; Keep the Arduino 2.0.17 / ESP-IDF 4.4 stack reproducible. Before upgrading,
; verify station fallback, SoftAP, .local resolution, BLE on hardware.
; PendingAwareWebServer in src/net/HttpServer.cpp depends on this WebServer version.
platform = platformio/espressif32@6.12.0
board = m5stick-s3
board_dir = boards
board_build.partitions = boards/pump-bug-8MB.csv
framework = arduino
custom_firmware_version_metadata =

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

extra_scripts =
    pre:scripts/version.py
    pre:scripts/build_web.py
    pre:scripts/embed_web.py

lib_deps =
    m5stack/M5Unified@0.2.14
    m5stack/M5GFX@0.2.20
    m5stack/M5PM1@1.0.6
    h2zero/NimBLE-Arduino@2.5.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_STICKS3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    ; Keep local PlatformIO package paths out of binaries and debug data.
    -ffile-prefix-map=${sysenv.HOME}/.platformio=/platformio
    ${sysenv.EXTRA_BUILD_FLAGS}

build_unflags = -std=gnu++11

upload_protocol = esp-builtin
debug_tool = esp-builtin

[env:release]
build_type = release

[env:debug]
build_type = debug
custom_firmware_version_metadata = debug
build_flags =
    ${env.build_flags}
    -DPB_UI_DEBUG_REMOTE=1
; Keep application INFO logs without flooding the serial screenshot protocol
; with dependency DEBUG/VERBOSE traffic from NimBLE and LovyanGFX.
debug_build_flags = -Og -g3 -ggdb3 -DCORE_DEBUG_LEVEL=3
